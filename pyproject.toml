[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hurriyet-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for Hürriyet news (headlines, full articles, search, latest)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
hurriyet-mcp = "hurriyet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hurriyet_mcp"]
